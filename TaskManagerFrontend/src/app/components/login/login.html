<div class="auth-page-wrapper d-flex justify-content-center align-items-center w-100">
  <div class="glass-card fade-in max-width-500 w-100 p-5 text-center">
    <div class="auth-header mb-5">
      <h1 class="display-5 fw-bold gradient-text">Welcome Back</h1>
      <p class="text-secondary">Login to manage your tasks efficiently</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger border-0 rounded-pill mb-4 small">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form text-start">
      <div class="form-group mb-4">
        <label for="username" class="form-label small fw-bold text-uppercase">Username</label>
        <input type="text" id="username" class="form-input" 
               [(ngModel)]="credentials.username" name="username" required
               placeholder="Your username">
      </div>

      <div class="form-group mb-5">
        <label for="password" class="form-label small fw-bold text-uppercase">Password</label>
        <input type="password" id="password" class="form-input" 
               [(ngModel)]="credentials.password" name="password" required
               placeholder="Your password">
      </div>

      <button type="submit" class="btn-primary-gradient w-100 py-3 rounded-pill fw-bold mb-4" 
              [disabled]="loginForm.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span> Logging in...
        } @else {
          Login
        }
      </button>

      <p class="text-muted small">
        Don't have an account? 
        <a [routerLink]="['/register']" class="text-primary fw-bold text-decoration-none">Register here</a>
      </p>
    </form>
  </div>
</div>
