<div class="auth-page-wrapper d-flex justify-content-center align-items-center w-100">
  <div class="glass-card fade-in max-width-500 w-100 p-5 text-center">
    <div class="auth-header mb-5">
      <h1 class="display-5 fw-bold gradient-text">Get Started</h1>
      <p class="text-secondary">Join us to manage your task masterfully</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger border-0 rounded-pill mb-4 small">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form text-start">
      <div class="form-group mb-4">
        <label for="username" class="form-label small fw-bold text-uppercase">Username</label>
        <input type="text" id="username" class="form-input" 
               [(ngModel)]="user.username" name="username" required
               placeholder="Your username">
      </div>

      <div class="form-group mb-4">
        <label for="email" class="form-label small fw-bold text-uppercase">Email</label>
        <input type="email" id="email" class="form-input" 
               [(ngModel)]="user.email" name="email" required email
               placeholder="Your email address">
      </div>

      <div class="form-group mb-5">
        <label for="password" class="form-label small fw-bold text-uppercase">Password</label>
        <input type="password" id="password" class="form-input" 
               [(ngModel)]="user.password" name="password" required minlength="6"
               placeholder="Min. 6 characters">
      </div>

      <button type="submit" class="btn-primary-gradient w-100 py-3 rounded-pill fw-bold mb-4" 
              [disabled]="registerForm.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span> Creating account...
        } @else {
          Register
        }
      </button>

      <p class="text-muted small">
        Already have an account? 
        <a [routerLink]="['/login']" class="text-primary fw-bold text-decoration-none">Login here</a>
      </p>
    </form>
  </div>
</div>
